name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck bin/parley-axi checks/*.sh tests/run.sh tests/stub/gh
      - run: bash tests/run.sh
